
"""JARVIS Markets - read-only Kalshi market scanner."""
import json
import urllib.parse
import urllib.request
from datetime import datetime, timezone

BASE = "https://api.elections.kalshi.com/trade-api/v2"
TIMEOUT = 20


def get_json(url):
    request = urllib.request.Request(
        url,
        headers={"User-Agent": "JARVIS-Markets/1.0"}
    )
    with urllib.request.urlopen(request, timeout=TIMEOUT) as response:
        return json.loads(response.read().decode("utf-8"))


def fetch_markets():
    url = BASE + "/markets?" + urllib.parse.urlencode({
        "status": "open",
        "limit": 100
    })
    data = get_json(url)
    return data.get("markets", [])


def number(value):
    try:
        return float(value or 0)
    except (TypeError, ValueError):
        return 0.0


def summarize(market):
    bid = number(market.get("yes_bid_dollars")) * 100
    ask = number(market.get("yes_ask_dollars")) * 100

    if bid == 0:
        bid = number(market.get("yes_bid"))
    if ask == 0:
        ask = number(market.get("yes_ask"))

    midpoint = round((bid + ask) / 2, 1) if bid and ask else None

    return {
        "ticker": market.get("ticker", "Unknown"),
        "title": market.get("title", "Untitled"),
        "yes_bid_cents": bid,
        "yes_ask_cents": ask,
        "market_implied_yes_probability": midpoint,
        "volume": number(market.get("volume")),
        "close_time": market.get("close_time", "Unknown"),
        "decision": "NO BET",
        "reason": "Prediction model is not validated."
    }


def main():
    now = datetime.now(timezone.utc)
    markets = fetch_markets()
    summaries = [summarize(m) for m in markets]

    summaries.sort(
        key=lambda m: m["volume"],
        reverse=True
    )

    output = {
        "scanner": "JARVIS Markets",
        "timestamp": now.strftime("%Y-%m-%d %H:%M UTC"),
        "mode": "READ ONLY - NO AUTOMATIC BETS",
        "markets_scanned": len(summaries),
        "markets": summaries[:20]
    }

    with open("scanner_results.json", "w", encoding="utf-8") as file:
        json.dump(output, file, indent=2)

    print(json.dumps(output, indent=2))


if __name__ == "__main__":
    main()
